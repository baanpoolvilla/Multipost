<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyBoss · Multi-Post — v2 (7 หน้ารวบ)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#FFFFFF; --bg-soft:#F7F9FC; --ink:#1B2537; --ink-soft:#64748B;
  --line:#E5E9F0; --brand-green:#4CB93F; --brand-navy:#1B2537;
  --module-color:#F97316; --module-color-bg:#FFF3EA; --module-color-dk:#C2570A;
  --success:#16A34A; --success-bg:#EAF7EF; --warning:#D97706; --warning-bg:#FDF3E7;
  --danger:#DC2626; --danger-bg:#FCECEC; --info:#3B82F6; --info-bg:#EAF1FE;
  --radius:10px; --radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Noto Sans Thai',-apple-system,Segoe UI,sans-serif;background:var(--bg-soft);color:var(--ink);font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:1px;font-weight:800;font-size:21px;padding:6px 8px 2px}
.logo .easy{color:var(--brand-green)} .logo .boss{color:var(--brand-navy)}
.mod-badge{display:flex;align-items:center;gap:8px;margin:10px 6px 14px;padding:9px 10px;border-radius:var(--radius);background:var(--module-color-bg);color:var(--module-color-dk);font-size:12px;font-weight:600}
.mod-badge i{font-size:16px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--radius);color:var(--ink);font-weight:500;font-size:14px;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav button i{font-size:19px;color:var(--ink-soft);width:20px;text-align:center}
.nav button:hover{background:var(--bg-soft)}
.nav button.active{background:var(--module-color-bg);color:var(--module-color-dk)}
.nav button.active i{color:var(--module-color)}
.nav .help{margin-top:6px;color:var(--ink-soft);font-size:13px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px;border-top:1px solid var(--line)}
.side-foot .ava{width:30px;height:30px;border-radius:50%;background:var(--brand-navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.side-foot small{color:var(--ink-soft);display:block;font-size:11px}
.main{padding:22px 26px;overflow:auto}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:20px;font-weight:700}
.topbar .sub{color:var(--ink-soft);font-size:13px;margin-top:2px}
.tb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);background:var(--bg);border:1px dashed var(--line);padding:5px 10px;border-radius:999px}
.src b{color:var(--module-color-dk);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:13px}
.btn:hover{border-color:#cfd6e2}
.btn.primary{background:var(--module-color);color:#fff;border-color:var(--module-color)}
.btn.green{background:var(--brand-green);color:#fff;border-color:var(--brand-green)}
.btn.sm{padding:6px 10px;font-size:12px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px}
.grid{display:grid;gap:16px}
.metrics{grid-template-columns:repeat(4,1fr)}
.metric{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.metric .lbl{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.metric .val{font-size:26px;font-weight:700;margin-top:6px}
.metric .trd{font-size:12px;margin-top:4px}
.up{color:var(--success)} .dn{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--module-color-bg);color:var(--module-color-dk)}
.chip.out{border:1px solid var(--line);color:var(--ink-soft);background:var(--bg)}
.chip.dash{border:1px dashed #cbd3e0;color:var(--ink-soft);background:var(--bg)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.b-ok{background:var(--success-bg);color:var(--success)} .b-wait{background:var(--warning-bg);color:var(--warning)}
.b-fail{background:var(--danger-bg);color:var(--danger)} .b-info{background:var(--info-bg);color:var(--info)}
textarea,input,select{width:100%;font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--bg);outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--module-color);box-shadow:0 0 0 3px var(--module-color-bg)}
.ico-btn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink-soft)}
.ico-btn:hover{background:var(--bg-soft)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}
tr:hover td{background:var(--bg-soft)}
.ava-sm{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--bg);padding:9px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.cal .day{background:var(--bg);min-height:92px;padding:7px}
.cal .day .n{font-size:12px;color:var(--ink-soft)}
.cal .day.off{background:var(--bg-soft)}
.cal .ev{font-size:10.5px;padding:3px 6px;border-radius:6px;margin-top:4px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev.o{background:var(--module-color-bg);color:var(--module-color-dk)}
.ev.g{background:var(--success-bg);color:var(--success)}
.ev.b{background:var(--info-bg);color:var(--info)}
.preview{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg-soft)}
.preview .ph{background:var(--bg);padding:12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.pv-card{margin:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.pv-head{display:flex;align-items:center;gap:8px;padding:10px}
.pv-img{height:130px;background:linear-gradient(135deg,#e8edf5,#dbe3ef);display:flex;align-items:center;justify-content:center;color:#aab4c6;font-size:26px}
.pv-body{padding:10px;font-size:12.5px;line-height:1.5}
.two{grid-template-columns:1fr 320px}
.mini{color:var(--ink-soft);font-size:12.5px}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
.pill-row{display:flex;flex-wrap:wrap;gap:7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--bg);padding:7px 13px;font-size:12.5px;color:var(--ink-soft);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--module-color-bg);color:var(--module-color-dk);font-weight:600}
.banner{border-radius:var(--radius-lg);padding:16px 20px;display:flex;align-items:center;gap:14px}
.banner.ok{background:var(--success-bg);border:1px solid #b6e2c6}
.banner.fail{background:var(--warning-bg);border:1px solid #f0d59a}
.statc{text-align:center;padding:18px 12px}.statc .ic{font-size:24px;margin-bottom:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.acc{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.acc .q{font-weight:600;display:flex;align-items:center;gap:8px}
.acc .a{color:var(--ink-soft);font-size:13px;margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:none;background:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--module-color-dk);border-bottom-color:var(--module-color)}
.detail{border:1px solid var(--module-color);border-radius:var(--radius-lg);margin-top:12px;overflow:hidden}
.detail .dh{background:var(--module-color-bg);padding:12px 16px;display:flex;align-items:center;gap:10px;color:var(--module-color-dk);font-weight:600}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;grid-column:1/3}
.login-card{width:380px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:34px 30px;text-align:center}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="logo"><span class="easy">Easy</span><span class="boss">Boss</span></div>
    <div class="mod-badge"><i class="ti ti-speakerphone"></i> Marketing · Multi-Post</div>
    <nav class="nav" id="nav">
      <button data-page="compose"><i class="ti ti-pencil-plus"></i> เขียนโพส</button>
      <button data-page="queue"><i class="ti ti-calendar"></i> คิว & ปฏิทิน</button>
      <button data-page="channels"><i class="ti ti-affiliate"></i> ช่องทาง</button>
      <button data-page="overview"><i class="ti ti-chart-line"></i> ภาพรวม</button>
      <button data-page="history"><i class="ti ti-clock-hour-4"></i> ประวัติ</button>
      <button data-page="team"><i class="ti ti-users"></i> ทีมงาน</button>
      <button data-page="agent"><i class="ti ti-robot"></i> Desktop Agent</button>
      <button class="help" data-page="guide"><i class="ti ti-help-circle"></i> คู่มือ / ช่วยเหลือ</button>
    </nav>
    <div class="side-foot">
      <div class="ava">BP</div>
      <div><div style="font-weight:600;font-size:13px">BaanPool</div><small>ผู้ดูแลระบบ</small></div>
    </div>
  </aside>
  <div class="main" id="main"></div>
</div>

<script>
const ui={page:'compose',compose:'page',queueView:'cal',queueF:'all',chan:'page',ovRange:1,ovT:'page',hist:'page',histOpen:null,team:'members'};
const on=(a,b)=>a===b?'on':'';
const src=(who,what)=>'<span class="src"><i class="ti ti-bulb"></i> แบบจาก <b>'+who+'</b> · '+what+'</span>';
function top(t,s,r){return '<div class="topbar"><div><h1>'+t+'</h1><div class="sub">'+s+'</div></div><div class="tb-actions">'+(r||'')+'</div></div>';}
function toggle(key,a,b){return '<div class="seg"><button class="'+on(ui[key],'page')+'" data-set="'+key+':page"><i class="ti ti-brand-facebook"></i> '+a+'</button><button class="'+on(ui[key],'group')+'" data-set="'+key+':group"><i class="ti ti-users-group"></i> '+b+'</button></div>';}
function metric(ic,l,v,t,c){return '<div class="metric"><div class="lbl"><i class="ti '+ic+'"></i> '+l+'</div><div class="val">'+v+'</div><div class="trd '+(c||'')+'">'+(t||'')+'</div></div>';}
function bars(a){return a.map(h=>'<div style="flex:1;background:var(--module-color-bg);border-radius:5px 5px 0 0;height:'+h+'%;position:relative"><div style="position:absolute;bottom:0;left:0;right:0;height:'+Math.round(h*0.55)+'%;background:var(--module-color);border-radius:5px 5px 0 0"></div></div>').join('');}
function rank(n,v){return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:11px"><div style="flex:1;font-size:13px">'+n+'</div><div style="width:90px;height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden"><div style="height:100%;width:'+v+'%;background:var(--module-color)"></div></div><div class="mini" style="width:26px;text-align:right">'+v+'</div></div>';}

/* ---------- 1. เขียนโพส ---------- */
function pCompose(){
  const grp=ui.compose==='group';
  const dest=grp
   ? '<div class="pill-row" style="margin-bottom:8px"><span class="chip on">📁 อสังหาภูเก็ต (42)</span><span class="chip on">📁 พูลวิลล่าไทย (28)</span><span class="chip dash"><i class="ti ti-plus"></i> เพิ่มหมวด</span></div><div class="mini" style="color:var(--warning)"><i class="ti ti-robot"></i> โพสผ่าน Desktop Agent · 70 กลุ่ม</div>'
   : '<div class="pill-row"><span class="chip on"><i class="ti ti-brand-facebook"></i> Baan Pool Villa <i class="ti ti-x"></i></span><span class="chip on">Phuket Rentals <i class="ti ti-x"></i></span><span class="chip on">Pool Villa TH <i class="ti ti-x"></i></span><span class="chip dash"><i class="ti ti-plus"></i> +3 เพจ</span></div>';
  return top('เขียนโพส','โพสต์เดียว ส่งได้ทั้งเพจและกลุ่ม',src('Buffer + Publer','composer รวมช่องทาง')+'<button class="btn">บันทึกร่าง</button><button class="btn primary"><i class="ti ti-send"></i> โพส</button>')+
  '<div style="margin-bottom:14px">'+toggle('compose','ลงเพจ','ลงกลุ่ม')+'</div>'+
  '<div class="grid two"><div class="card"><div class="mini" style="margin-bottom:8px">โพสต์ไปยัง</div>'+dest+
  '<textarea rows="5" style="margin-top:14px">บ้านพักพูลวิลล่าภูเก็ต 3 ห้องนอน สระส่วนตัว 🏖️\nว่างช่วงสงกรานต์ จองด่วน!\n#พูลวิลล่า #ภูเก็ต</textarea>'+
  '<div style="display:flex;align-items:center;gap:7px;margin-top:10px"><button class="ico-btn"><i class="ti ti-photo"></i></button><button class="ico-btn"><i class="ti ti-mood-smile"></i></button><button class="ico-btn"><i class="ti ti-template"></i></button><button class="ico-btn" style="border-color:var(--module-color);color:var(--module-color)"><i class="ti ti-sparkles"></i></button><span style="margin-left:auto" class="mini">142 ตัวอักษร</span></div>'+
  '<hr class="sep"><div style="display:flex;align-items:center;gap:10px"><span class="mini">เวลา:</span><span class="chip out">โพสทันที</span><span class="chip on"><i class="ti ti-clock"></i> ตั้งเวลา 18:00</span></div></div>'+
  '<div class="preview"><div class="ph"><i class="ti ti-eye"></i> พรีวิว ('+(grp?'กลุ่ม':'เพจ')+')</div><div class="pv-card"><div class="pv-head"><div class="ava-sm" style="background:var(--brand-navy)">'+(grp?'GR':'BP')+'</div><div style="font-size:12.5px;font-weight:600">'+(grp?'อสังหาภูเก็ต':'Baan Pool Villa')+'</div></div><div class="pv-img"><i class="ti ti-photo"></i></div><div class="pv-body">บ้านพักพูลวิลล่าภูเก็ต 3 ห้องนอน สระส่วนตัว 🏖️ ว่างช่วงสงกรานต์!</div></div></div></div>';
}

/* ---------- 2. คิว & ปฏิทิน ---------- */
function pQueue(){
  const f=ui.queueF;
  const right=src('Buffer + Later','queue + calendar')+'<div class="seg"><button class="'+on(ui.queueView,'cal')+'" data-set="queueView:cal"><i class="ti ti-calendar"></i> ปฏิทิน</button><button class="'+on(ui.queueView,'list')+'" data-set="queueView:list"><i class="ti ti-list"></i> รายการ</button></div>';
  const filt='<div style="margin-bottom:14px;display:flex;gap:8px;align-items:center"><span class="mini">แสดง:</span><div class="seg"><button class="'+on(f,'all')+'" data-set="queueF:all">ทั้งหมด</button><button class="'+on(f,'page')+'" data-set="queueF:page">เพจ</button><button class="'+on(f,'group')+'" data-set="queueF:group">กลุ่ม</button></div></div>';
  let body;
  if(ui.queueView==='cal'){
    body='<div class="cal"><div class="dow">จ</div><div class="dow">อ</div><div class="dow">พ</div><div class="dow">พฤ</div><div class="dow">ศ</div><div class="dow">ส</div><div class="dow">อา</div>'+
    day('14','<div class="ev g">เปิดจอง</div>',f,'page')+day('15',ev('o','พูลวิลล่า',f,'page'),f)+day('16','')+
    day('17',ev('o','18:00 เพจ',f,'page')+ev('b','40 กลุ่ม',f,'group'),f)+
    day('18',ev('g','โปรสงกรานต์',f,'page')+ev('b','แชร์กลุ่ม',f,'group'),f)+day('19','')+day('20',ev('o','ห้องว่าง',f,'page'),f,'off')+'</div>';
  } else {
    body='<div class="grid" style="gap:12px">'+
    (f!=='group'?qItem('วันนี้','18:00','บ้านพักพูลวิลล่า 3 ห้องนอน...','3 เพจ','page','wait','กำลังรอ'):'')+
    (f!=='page'?qItem('วันนี้','19:00','โปรสงกรานต์ ลด 20%...','40 กลุ่ม','group','info','กำลังโพส 18/40'):'')+
    (f!=='group'?qItem('พรุ่งนี้','09:30','รีวิวลูกค้า 5 ดาว...','6 เพจ','page','wait','กำลังรอ'):'')+
    (f!=='page'?qItem('พรุ่งนี้','20:00','ห้องว่างสุดสัปดาห์...','25 กลุ่ม','group','wait','รอ Agent'):'')+'</div>';
  }
  return top('คิว & ปฏิทิน','งานที่ตั้งเวลาไว้ ทั้งเพจและกลุ่มในที่เดียว',right)+filt+body;
}
function ev(c,t,f,who){ if(f!=='all'&&who&&f!==who)return ''; return '<div class="ev '+c+'">'+t+'</div>'; }
function day(n,e,f,cls){return '<div class="day '+(cls==='off'?'off':'')+'"><div class="n">'+n+'</div>'+(e||'')+'</div>';}
function qItem(d,t,txt,dest,who,st,lbl){var b='b-'+st;var ic=who==='group'?'ti-users-group':'ti-brand-facebook';return '<div class="card" style="display:flex;align-items:center;gap:16px;padding:13px 18px"><div style="text-align:center;min-width:76px"><div style="font-weight:700;font-size:13px">'+d+'</div><div class="mini">'+t+'</div></div><div style="flex:1"><div style="font-weight:500">'+txt+'</div><div class="mini" style="margin-top:3px"><i class="ti '+ic+'"></i> '+dest+'</div></div><span class="badge '+b+'">'+lbl+'</span><button class="ico-btn"><i class="ti ti-dots"></i></button></div>';}

/* ---------- 3. ช่องทาง ---------- */
function pChannels(){
  const tabs='<div class="tabs"><button class="'+on(ui.chan,'page')+'" data-set="chan:page">เพจ (18)</button><button class="'+on(ui.chan,'group')+'" data-set="chan:group">กลุ่ม (128)</button></div>';
  let body;
  if(ui.chan==='page'){
    body='<div class="grid" style="grid-template-columns:repeat(3,1fr)">'+pageCard('Baan Pool Villa','12.4K','ok')+pageCard('Phuket Rentals','8.1K','ok')+pageCard('Pool Villa TH','5.6K','ok')+pageCard('Krabi Stay','3.2K','wait')+pageCard('Samui Villas','2.8K','ok')+pageCard('Hua Hin Homes','1.9K','fail')+'</div>';
  } else {
    body='<div class="pill-row" style="margin-bottom:14px"><span class="chip on">ทั้งหมด (128)</span><span class="chip out">🌐 Public (74)</span><span class="chip out">🔒 Private (39)</span><span class="chip out">💰 เสียตัง (15)</span></div><div class="grid" style="grid-template-columns:repeat(2,1fr)">'+groupCat('อสังหาภูเก็ต','#F97316','42','Public')+groupCat('เช่าบ้านพักตากอากาศ','#3B82F6','31','Private')+groupCat('พูลวิลล่าไทยแลนด์','#8B5CF6','28','Public')+groupCat('กลุ่มพรีเมียม','#EC4899','15','เสียตัง')+'</div>';
  }
  const add=ui.chan==='page'?'<button class="btn green"><i class="ti ti-plus"></i> เชื่อมต่อเพจ</button>':'<button class="btn">+ สร้างหมวด</button><button class="btn green"><i class="ti ti-plus"></i> เพิ่มกลุ่ม</button>';
  return top('ช่องทาง','จัดการเพจและกลุ่มทั้งหมด',src('Buffer + Notion','channels + หมวดสี')+add)+tabs+body;
}
function pageCard(n,f,st){var b=st==='ok'?'b-ok':st==='wait'?'b-wait':'b-fail';var l=st==='ok'?'เชื่อมต่อ':st==='wait'?'รอต่ออายุ':'หลุด';return '<div class="card" style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px"><div class="ava-sm" style="width:38px;height:38px;background:var(--brand-navy)"><i class="ti ti-brand-facebook" style="font-size:18px"></i></div><div><div style="font-weight:600">'+n+'</div><div class="mini">'+f+' ผู้ติดตาม</div></div></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="badge '+b+'">'+l+'</span><button class="ico-btn" style="width:30px;height:30px"><i class="ti ti-settings"></i></button></div></div>';}
function groupCat(n,c,cnt,type){return '<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="width:12px;height:12px;border-radius:4px;background:'+c+'"></span><div style="font-weight:600;flex:1">'+n+'</div><span class="chip out">'+type+'</span></div><div class="mini">'+cnt+' กลุ่ม</div><div style="margin-top:10px;display:flex;gap:6px"><button class="btn sm"><i class="ti ti-send"></i> โพสหมวดนี้</button><button class="ico-btn" style="width:32px;height:32px"><i class="ti ti-edit"></i></button></div></div>';}

/* ---------- 4. ภาพรวม ---------- */
function pOverview(){
  const R=['วันนี้','7 วัน','15 วัน','1 เดือน','3 เดือน','ทั้งหมด'];
  const rangeSeg='<div class="seg">'+R.map((t,i)=>'<button class="'+on(ui.ovRange,i)+'" data-set="ovRange:'+i+'">'+t+'</button>').join('')+'</div>';
  const grp=ui.ovT==='group';
  const m=grp
   ? metric('ti-users-group','กลุ่ม','128')+metric('ti-share','แชร์','642','+18% ▲','up')+metric('ti-check','สำเร็จ','93.2%','-0.6% ▼','dn')+metric('ti-alert-triangle','ล้มเหลว','44','','dn')
   : metric('ti-brand-facebook','เพจ','18')+metric('ti-send','โพส','342','+12% ▲','up')+metric('ti-check','สำเร็จ','96.4%','+1.2% ▲','up')+metric('ti-alert-triangle','ล้มเหลว','12','','dn');
  return top('ภาพรวม','รวมภาพรวม + สรุปช่วงเวลา + กิจกรรม ในหน้าเดียว',src('Metricool + Hootsuite','analytics + date range'))+
  '<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">'+toggle('ovT','เพจ','กลุ่ม')+'<span class="mini">ช่วงเวลา:</span>'+rangeSeg+'</div>'+
  '<div class="grid metrics" style="margin-bottom:16px">'+m+'</div>'+
  '<div class="grid" style="grid-template-columns:1.6fr 1fr"><div class="card"><div style="font-weight:700;margin-bottom:14px">'+(grp?'แชร์กลุ่ม':'โพส')+'ต่อวัน</div><div style="display:flex;align-items:flex-end;gap:8px;height:150px">'+bars(grp?[55,70,60,85,78,90,66,94,72,88,80,96]:[40,65,52,80,72,95,60,88,70,100,84,76])+'</div></div>'+
  '<div class="card"><div style="font-weight:700;margin-bottom:12px">'+(grp?'หมวดกลุ่มยอดนิยม':'เพจที่โพสบ่อยสุด')+'</div>'+(grp?rank('อสังหาภูเก็ต','92')+rank('เช่าบ้านพัก','78')+rank('พูลวิลล่าไทย','64')+rank('พรีเมียม','40'):rank('Baan Pool Villa','86')+rank('Phuket Rentals','72')+rank('Pool Villa TH','65')+rank('Krabi Stay','41'))+'</div></div>';
}

/* ---------- 5. ประวัติ ---------- */
const HIST=[
 {t:'โปรสงกรานต์ ลด 20%',dest:'6 เพจ',who:'แนน',time:'วันนี้ 09:30',st:'ok',lbl:'สำเร็จ',rows:[['Baan Pool Villa','ok'],['Phuket Rentals','ok'],['Pool Villa TH','ok'],['Krabi Stay','ok'],['Samui Villas','ok'],['Hua Hin Homes','ok']]},
 {t:'ห้องว่างสุดสัปดาห์',dest:'5 เพจ',who:'แนน',time:'เมื่อวาน 12:00',st:'fail',lbl:'ล้มเหลว 1',rows:[['Baan Pool Villa','ok'],['Phuket Rentals','ok'],['Pool Villa TH','ok'],['Krabi Stay','fail'],['Samui Villas','ok']]},
 {t:'แชร์โปรกลุ่มภูเก็ต',dest:'40 กลุ่ม',who:'มิ้น',time:'เมื่อวาน 10:00',st:'ok',lbl:'40/40',rows:[['อสังหาภูเก็ต','ok'],['เช่าบ้านพัก','ok'],['พูลวิลล่าไทย','ok'],['กลุ่มพรีเมียม','ok']]}
];
function pHistory(){
  const f=ui.hist;
  const filt='<div style="margin-bottom:14px;display:flex;gap:8px;align-items:center"><span class="mini">แสดง:</span><div class="seg"><button class="'+on(f,'all')+'" data-set="hist:all">ทั้งหมด</button><button class="'+on(f,'page')+'" data-set="hist:page">เพจ</button><button class="'+on(f,'group')+'" data-set="hist:group">กลุ่ม</button></div><span class="mini" style="margin-left:auto">คลิกแถวเพื่อดูรายงานรอบนั้น ↓</span></div>';
  let rows='';
  HIST.forEach((h,i)=>{ const isG=h.dest.includes('กลุ่ม'); if(f==='page'&&isG)return; if(f==='group'&&!isG)return;
    rows+='<tr data-open="'+i+'"><td style="font-weight:500">'+h.t+'</td><td class="mini">'+h.dest+'</td><td>'+h.who+'</td><td class="mini">'+h.time+'</td><td><span class="badge b-'+h.st+'">'+h.lbl+'</span></td><td><i class="ti ti-chevron-'+(ui.histOpen===i?'up':'down')+'" style="color:var(--ink-soft)"></i></td></tr>';
    if(ui.histOpen===i){ rows+='<tr><td colspan="6" style="padding:0;background:var(--bg-soft)">'+detail(h)+'</td></tr>'; }
  });
  return top('ประวัติ','ประวัติ + รายงานผล รวมกัน (เพจ/กลุ่ม)',src('Mixpost + Buffer','history + drill-down report'))+filt+
  '<div class="card" style="padding:0"><table><thead><tr><th>เนื้อหา</th><th>ปลายทาง</th><th>ผู้โพส</th><th>เวลา</th><th>สถานะ</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function detail(h){
  const ok=h.rows.filter(r=>r[1]==='ok').length, fail=h.rows.length-ok;
  let list=h.rows.map(r=>'<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)"><i class="ti '+(r[1]==='ok'?'ti-circle-check" style="color:var(--success)':'ti-circle-x" style="color:var(--danger)')+'"></i><span style="flex:1;font-size:13px">'+r[0]+'</span><span class="badge b-'+r[1]+'">'+(r[1]==='ok'?'สำเร็จ':'ล้มเหลว')+'</span>'+(r[1]==='fail'?'<button class="btn sm">โพสซ้ำ</button>':'')+'</div>').join('');
  return '<div class="detail"><div class="dh"><i class="ti ti-file-report"></i> รายงานผล: '+h.t+' <span style="margin-left:auto;font-weight:400" class="mini">สำเร็จ '+ok+' · ล้มเหลว '+fail+'</span></div><div style="padding:6px 16px 14px">'+list+'</div></div>';
}

/* ---------- 6. ทีมงาน ---------- */
function pTeam(){
  const tabs='<div class="tabs"><button class="'+on(ui.team,'members')+'" data-set="team:members">สมาชิก</button><button class="'+on(ui.team,'activity')+'" data-set="team:activity">กิจกรรม</button><button class="'+on(ui.team,'audit')+'" data-set="team:audit">Audit log</button></div>';
  let body,rt='';
  if(ui.team==='members'){ rt='<button class="btn primary"><i class="ti ti-user-plus"></i> เพิ่มสมาชิก</button>';
    body='<div class="card" style="padding:0"><table><thead><tr><th>สมาชิก</th><th>อีเมล</th><th>บทบาท</th><th>สิทธิ์</th><th>สถานะ</th></tr></thead><tbody>'+staffRow('BP','บอส','boss@baanpool.com','ผู้ดูแลระบบ','ทั้งหมด','ok','ออนไลน์','var(--brand-navy)')+staffRow('แน','แนน','nan@baanpool.com','ผู้จัดการ','โพส+จัดการเพจ','ok','ออนไลน์','var(--module-color)')+staffRow('มิ','มิ้น','min@baanpool.com','ทีมโพส','โพสอย่างเดียว','wait','ออฟไลน์','#3B82F6')+staffRow('กร','กร','korn@baanpool.com','ทีมโพส','โพสอย่างเดียว','ok','ออนไลน์','#8B5CF6')+'</tbody></table></div>';
  } else if(ui.team==='activity'){
    body='<div class="grid" style="grid-template-columns:repeat(3,1fr)">'+userCard('แนน','ผู้จัดการ','var(--module-color)','128','98%')+userCard('มิ้น','ทีมโพส','#3B82F6','86','95%')+userCard('กร','ทีมโพส','#8B5CF6','64','97%')+'</div>';
  } else {
    body='<div class="card">'+logRow('บอส','เพิ่มสมาชิกใหม่','กร (ทีมโพส)','วันนี้ 08:15')+logRow('บอส','แก้ไขสิทธิ์','มิ้น → ทีมโพส','เมื่อวาน 16:20')+logRow('แนน','รีเซ็ตรหัสผ่าน','บัญชี มิ้น','13 ก.ค. 11:00')+'</div>';
  }
  return top('ทีมงาน','สมาชิก + กิจกรรม + Audit log รวมกัน',src('Mixpost + Linear','roles + activity')+rt)+tabs+body;
}
function staffRow(i,n,m,r,p,st,l,c){return '<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="ava-sm" style="background:'+c+'">'+i+'</div><b style="font-weight:600">'+n+'</b></div></td><td class="mini">'+m+'</td><td><span class="chip out">'+r+'</span></td><td class="mini">'+p+'</td><td><span class="badge b-'+st+'">'+l+'</span></td></tr>';}
function userCard(n,r,c,p,rt){return '<div class="card" style="text-align:center"><div class="ava-sm" style="width:48px;height:48px;margin:0 auto 8px;background:'+c+';font-size:16px">'+n[0]+'</div><div style="font-weight:600">'+n+'</div><span class="chip out" style="margin-top:4px">'+r+'</span><div style="display:flex;justify-content:center;gap:20px;margin-top:12px"><div><div style="font-weight:700">'+p+'</div><div class="mini">โพส</div></div><div><div style="font-weight:700;color:var(--success)">'+rt+'</div><div class="mini">สำเร็จ</div></div></div></div>';}
function logRow(w,a,d,t){return '<div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)"><div class="ava-sm" style="background:var(--module-color)">'+w[0]+'</div><div style="flex:1;font-size:13px"><b style="font-weight:600">'+w+'</b> <span class="mini">'+a+'</span> · <span style="color:var(--module-color-dk)">'+d+'</span></div><div class="mini">'+t+'</div></div>';}

/* ---------- 7. Desktop Agent ---------- */
function pAgent(){
  return top('Desktop Agent','โปรแกรมโพส Facebook กลุ่ม (Windows)',src('Vercel + Linear','install + live status'))+
  '<div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div style="width:46px;height:46px;border-radius:12px;background:var(--module-color-bg);color:var(--module-color);display:flex;align-items:center;justify-content:center;font-size:22px"><i class="ti ti-robot"></i></div><div style="flex:1;min-width:200px"><div style="font-weight:700">MultiPost Desktop Agent <span class="mini">v2.0.0</span></div><div class="mini">ติดตั้งบน Windows · ไม่ต้องลง Node.js แยก</div></div><button class="btn primary"><i class="ti ti-download"></i> ดาวน์โหลด Agent</button></div>'+
  '<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px"><div class="card statc"><div class="ic"><span class="dot" style="background:var(--success)"></span></div><div style="font-weight:700">ออนไลน์</div><div class="mini">สถานะ Agent</div></div><div class="card statc"><div class="ic" style="color:var(--success)"><i class="ti ti-player-play"></i></div><div style="font-weight:700">กำลังทำงาน</div><div class="mini">Job Runner</div></div><div class="card statc"><div class="ic"><span class="dot" style="background:var(--success)"></span></div><div style="font-weight:700">Connected</div><div class="mini">Database</div></div></div>'+
  '<div class="card"><div style="font-weight:700;margin-bottom:10px"><i class="ti ti-info-circle"></i> วิธีใช้งาน (ครั้งแรก)</div><ol style="margin-left:18px;line-height:2;font-size:13.5px"><li>แตกไฟล์ zip → ดับเบิลคลิก install.bat (ครั้งแรกครั้งเดียว)</li><li>ดับเบิลคลิก start.bat เพื่อเริ่มโปรแกรม</li><li>ไปแท็บ บัญชี Facebook → เข้าสู่ระบบ</li><li>กลับมาเว็บ → คิว & ปฏิทิน → สร้างงานกลุ่ม → Agent รับงานอัตโนมัติ</li></ol></div>';
}
function pGuide(){
  return top('คู่มือ / ช่วยเหลือ','ขั้นตอนการใช้งานทั้งระบบ',src('Stripe Docs','help layout'))+
  '<div class="acc"><div class="q"><i class="ti ti-number-1" style="color:var(--module-color)"></i> เชื่อมต่อเพจ / กลุ่ม</div><div class="a">ไปที่ "ช่องทาง" → เลือกแท็บ เพจ หรือ กลุ่ม → เชื่อมต่อ</div></div>'+
  '<div class="acc"><div class="q"><i class="ti ti-number-2" style="color:var(--module-color)"></i> โพสลงหลายที่พร้อมกัน</div><div class="a">ไปที่ "เขียนโพส" → สลับ ลงเพจ/ลงกลุ่ม → เลือกปลายทาง → เขียน → โพสหรือตั้งเวลา</div></div>'+
  '<div class="acc"><div class="q"><i class="ti ti-number-3" style="color:var(--module-color)"></i> โพสกลุ่มต้องมี Desktop Agent</div><div class="a">ติดตั้ง Agent บน Windows แล้วเปิดค้างไว้ ระบบจะส่งงานให้อัตโนมัติ</div></div>'+
  '<div class="acc"><div class="q"><i class="ti ti-number-4" style="color:var(--module-color)"></i> ดูผลและรายงาน</div><div class="a">ดูผลรายรอบที่ "ประวัติ" (คลิกแถว) หรือดูสรุปที่ "ภาพรวม" เลือกช่วงเวลาได้</div></div>';
}

const RENDER={compose:pCompose,queue:pQueue,channels:pChannels,overview:pOverview,history:pHistory,team:pTeam,agent:pAgent,guide:pGuide};
function render(){
  document.getElementById('main').innerHTML=RENDER[ui.page]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===ui.page));
  window.scrollTo(0,0);
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b){ui.page=b.dataset.page;ui.histOpen=null;render();}});
document.getElementById('main').addEventListener('click',e=>{
  const s=e.target.closest('[data-set]'); if(s){const[k,v]=s.dataset.set.split(':');ui[k]=(k==='ovRange')?parseInt(v):v;render();return;}
  const o=e.target.closest('[data-open]'); if(o){const i=parseInt(o.dataset.open);ui.histOpen=ui.histOpen===i?null:i;render();}
});
render();
</script>
</body>
</html>
