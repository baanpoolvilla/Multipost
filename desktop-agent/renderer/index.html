<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>MultiPost – Desktop Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar nav -->
<nav class="sidenav">
  <div class="sidenav-brand">🤖 Agent v2</div>

  <button class="nav-item active" data-tab="status">
    <span class="nav-icon">📊</span><span>สถานะ</span>
  </button>
  <button class="nav-item" data-tab="accounts">
    <span class="nav-icon">👤</span><span>Accounts</span>
  </button>
  <button class="nav-item" data-tab="jobs">
    <span class="nav-icon">📋</span><span>Job Queue</span>
    <span class="nav-badge" id="pendingBadge" style="display:none">0</span>
  </button>

  <div class="sidenav-footer">
    <div class="status-row">
      <span class="dot" id="dotApi"></span>
      <span id="lblApi">API: ...</span>
    </div>
    <div class="status-row">
      <span class="dot" id="dotDb"></span>
      <span id="lblDb">DB: ...</span>
    </div>
    <div class="status-row">
      <span class="dot" id="dotRunner"></span>
      <span id="lblRunner">Runner: หยุด</span>
    </div>
  </div>
</nav>

<!-- Content area -->
<div class="content">

  <!-- ── TAB: STATUS ── -->
  <section id="tab-status" class="tab active">
    <div class="tab-header">
      <h1>📊 สถานะ Agent</h1>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-green" id="btnStart" onclick="startRunner()">▶ เริ่ม Runner</button>
        <button class="btn btn-red"   id="btnStop"  onclick="stopRunner()" disabled>⏹ หยุด</button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Local API</div>
        <div class="stat-val" id="statApi">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Database</div>
        <div class="stat-val" id="statDb">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Runner</div>
        <div class="stat-val" id="statRunner">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Uptime</div>
        <div class="stat-val" id="statUptime">—</div>
      </div>
    </div>

    <div class="card log-card">
      <div class="card-title">
        📄 Log
        <button class="btn-link ml-auto" onclick="clearLog()">ล้าง</button>
      </div>
      <div class="log-output" id="logOutput"></div>
    </div>
  </section>

  <!-- ── TAB: ACCOUNTS ── -->
  <section id="tab-accounts" class="tab">
    <div class="tab-header">
      <h1>👤 Account Manager</h1>
      <button class="btn btn-primary" onclick="toggleAddAccount()">+ เพิ่ม Account</button>
    </div>

    <!-- Add form -->
    <div class="card" id="addAccountForm" style="display:none">
      <div class="card-title">เพิ่ม Facebook Account</div>
      <div class="form-row">
        <div class="form-col">
          <label class="field-label">Email / Phone</label>
          <input type="text"     id="accEmail"    placeholder="email@example.com">
        </div>
        <div class="form-col">
          <label class="field-label">Password</label>
          <input type="password" id="accPassword" placeholder="รหัสผ่าน">
        </div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:.5rem">
        <button class="btn btn-primary" onclick="addAccount()">บันทึก</button>
        <button class="btn btn-secondary" onclick="toggleAddAccount()">ยกเลิก</button>
      </div>
    </div>

    <!-- Account list -->
    <div class="card">
      <div class="card-title">Accounts <span class="badge" id="accCount">0</span></div>
      <div id="accountsList">
        <div class="empty-state">ยังไม่มี Account — กด "เพิ่ม Account" ด้านบน</div>
      </div>
    </div>
  </section>

  <!-- ── TAB: JOB QUEUE ── -->
  <section id="tab-jobs" class="tab">
    <div class="tab-header">
      <h1>📋 Job Queue</h1>
      <button class="btn btn-primary" onclick="toggleCreateJob()">+ สร้าง Job</button>
    </div>

    <!-- Create job form -->
    <div id="createJobForm" style="display:none">
      <div class="card">
        <div class="card-title">สร้าง Job โพสต์กลุ่ม</div>

        <div class="form-row">
          <div class="form-col" style="flex:1.5">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label class="field-label">โพสต์ล่าสุด</label>
              <button class="btn-link" onclick="loadRecentPosts()">🔄 โหลด</button>
            </div>
            <div id="recentPostsList" class="pick-list">
              <div class="empty-list">กด "โหลด" เพื่อดูโพสต์ล่าสุด</div>
            </div>
            <label class="field-label" style="margin-top:.5rem">ข้อความ</label>
            <textarea id="jobMsg" rows="4" placeholder="พิมพ์ข้อความ หรือเลือกจากโพสต์ล่าสุด..."></textarea>
          </div>
          <div class="form-col">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label class="field-label">กลุ่ม</label>
              <div>
                <button class="btn-link" onclick="selAll()">ทั้งหมด</button>
                <button class="btn-link" onclick="selNone()">ยกเลิก</button>
                <button class="btn-link" onclick="loadGroups()">🔄</button>
              </div>
            </div>
            <div id="groupPickList" class="pick-list" style="max-height:160px">
              <div class="loading">กำลังโหลด...</div>
            </div>
            <div style="display:flex;gap:.75rem;margin-top:.5rem;align-items:center">
              <div>
                <label class="field-label">Account</label>
                <select id="jobAccount" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:.35rem .5rem;font-size:12px;font-family:inherit">
                  <option value="">Auto (account ที่ login)</option>
                </select>
              </div>
              <div>
                <label class="field-label">Delay (วินาที)</label>
                <input type="number" id="jobDelay" value="5" min="1" max="120" style="width:70px">
              </div>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:.5rem;margin-top:.75rem">
          <button class="btn btn-primary" onclick="createJob()">📋 เพิ่มลงคิว</button>
          <button class="btn btn-secondary" onclick="toggleCreateJob()">ยกเลิก</button>
        </div>
      </div>
    </div>

    <!-- Jobs list -->
    <div class="card">
      <div class="card-title">
        Jobs
        <div class="status-filter" style="margin-left:.75rem">
          <button class="filter-btn active" data-filter="all"     onclick="filterJobs(this,'all')">ทั้งหมด</button>
          <button class="filter-btn"        data-filter="pending" onclick="filterJobs(this,'pending')">รอ</button>
          <button class="filter-btn"        data-filter="running" onclick="filterJobs(this,'running')">กำลังทำ</button>
          <button class="filter-btn"        data-filter="done"    onclick="filterJobs(this,'done')">เสร็จ</button>
          <button class="filter-btn"        data-filter="failed"  onclick="filterJobs(this,'failed')">ล้มเหลว</button>
        </div>
        <button class="btn-link ml-auto" onclick="loadJobs()">🔄 รีเฟรช</button>
      </div>
      <div id="jobsList"></div>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
